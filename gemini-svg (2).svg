<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="350" style="background: #06060c; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040408" />
      <stop offset="50%" stop-color="#0a0a16" />
      <stop offset="100%" stop-color="#05050d" />
    </linearGradient>

    <linearGradient id="text-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <filter id="glow-cyan-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-purple-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121225" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#080815" stop-opacity="0.9"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d1d3b" stroke-width="0.7" opacity="0.6"/>
    </pattern>

    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes floating {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes scanning {
        0% { top: 0%; opacity: 0; }
        50% { opacity: 0.8; }
        100% { top: 100%; opacity: 0; }
      }
      @keyframes slide-in {
        from { transform: translateX(-50px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes scale-up {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .anim-glow { animation: pulse-glow 4s ease-in-out infinite; }
      .anim-float-1 { animation: floating 5s ease-in-out infinite; }
      .anim-float-2 { animation: float-reverse 6s ease-in-out infinite; }
      .skill-card { transition: all 0.3s ease; }
      .skill-card:hover { transform: translateY(-5px); stroke: #00f3ff; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <circle cx="950" cy="80" r="120" fill="#9d4edd" opacity="0.15" filter="url(#glow-purple-soft)" class="anim-float-1" />
  <circle cx="1100" cy="270" r="90" fill="#00f3ff" opacity="0.1" filter="url(#glow-cyan-heavy)" class="anim-float-2" />
  <path d="M -50 150 Q 300 50 600 200 T 1250 100" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.15" class="anim-glow" />
  <path d="M -50 200 Q 250 320 650 100 T 1250 250" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.15" class="anim-glow" />

  <rect x="15" y="15" width="1170" height="320" rx="12" fill="none" stroke="#1d1d3b" stroke-width="2" />
  <path d="M 15 50 L 15 25 L 50 25" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round" filter="url(#glow-cyan-heavy)"/>
  <path d="M 1185 50 L 1185 25 L 1150 25" fill="none" stroke="#00f3ff" stroke-width="4" stroke-linecap="round" filter="url(#glow-cyan-heavy)"/>
  <path d="M 15 300 L 15 325 L 50 325" fill="none" stroke="#9d4edd" stroke-width="4" stroke-linecap="round" filter="url(#glow-purple-soft)"/>
  <path d="M 1185 300 L 1185 325 L 1150 325" fill="none" stroke="#9d4edd" stroke-width="4" stroke-linecap="round" filter="url(#glow-purple-soft)"/>

  <g transform="translate(60, 55)" style="animation: slide-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
    <text x="0" y="40" font-size="44" font-weight="900" fill="url(#text-neon)" letter-spacing="1.5" filter="url(#glow-purple-soft)">SOWMYA SRI</text>
    
    <g transform="translate(0, 60)">
      <rect width="165" height="30" rx="6" fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-width="1" filter="url(#glow-cyan-heavy)"/>
      <text x="15" y="20" font-size="14" font-weight="800" fill="#00f3ff" letter-spacing="2">DATA ANALYST</text>
    </g>

    <g transform="translate(0, 115)">
      <path d="M 0 -2 L 10 -8 L 20 -2 L 10 4 Z" fill="none" stroke="#9d4edd" stroke-width="2"/>
      <path d="M 4 -4 L 4 4 Q 10 8 16 4 L 16 -4" fill="none" stroke="#9d4edd" stroke-width="2"/>
      <text x="30" y="2" font-size="15" font-weight="600" fill="#e2e8f0" opacity="0.95">B.Sc Data Science Student</text>
      
      <path d="M 0 25 A 6 6 0 0 1 12 25 Q 12 33 6 39 Q 0 33 0 25 Z" fill="none" stroke="#00f3ff" stroke-width="2"/>
      <circle cx="6" cy="25" r="2" fill="#00f3ff"/>
      <text x="30" y="31" font-size="15" font-weight="600" fill="#a0aec0">India</text>
    </g>

    <g transform="translate(0, 195)">
      <text x="0" y="15" font-size="18" font-weight="600" fill="#00f3ff" font-style="italic" letter-spacing="0.5">"Turning Data into Insights 📊"</text>
    </g>
    
    <circle cx="0" cy="-20" r="2" fill="#00f3ff"/>
    <circle cx="15" cy="-20" r="2" fill="#00f3ff" opacity="0.5"/>
    <circle cx="30" cy="-20" r="2" fill="#00f3ff" opacity="0.2"/>
  </g>

  <g transform="translate(610, 45)" style="animation: scale-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
    <rect width="520" height="255" rx="16" fill="url(#card-grad)" stroke="#1f1f3a" stroke-width="2"/>
    <rect width="520" height="255" rx="16" fill="none" stroke="#9d4edd" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glow-purple-soft)"/>
    
    <text x="30" y="38" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="2">CORE TECH STACK</text>
    <line x1="30" y1="48" x2="190" y2="48" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan-heavy)" />
    <circle cx="200" cy="48" r="2.5" fill="#00f3ff" />

    <g class="anim-float-1" transform="translate(30, 70)">
      <rect class="skill-card" width="140" height="45" rx="8" fill="#15152a" stroke="#25254a" stroke-width="1.5"/>
      <path d="M 22 15 A 4 4 0 0 1 26 19 L 26 23 A 1 1 0 0 1 25 24 L 18 24 A 2 2 0 0 0 16 26 L 16 27 A 1 1 0 0 1 15 28 L 13 28 A 4 4 0 0 1 9 24 L 9 20 A 1 1 0 0 1 10 19 L 17 19 A 2 2 0 0 0 19 17 L 19 16 A 1 1 0 0 1 20 15 Z" fill="#38bdf8"/>
      <path d="M 18 31 A 4 4 0 0 1 14 27 L 14 23 A 1 1 0 0 1 15 22 L 22 22 A 2 2 0 0 0 24 20 L 24 19 A 1 1 0 0 1 25 18 L 27 18 A 4 4 0 0 1 31 22 L 31 26 A 1 1 0 0 1 30 27 L 23 27 A 2 2 0 0 0 21 29 L 21 30 A 1 1 0 0 1 20 31 Z" fill="#facc15"/>
      <text x="45" y="27" font-size="14" font-weight="700" fill="#e2e8f0">Python</text>
    </g>

    <g class="anim-float-2" transform="translate(190, 70)">
      <rect class="skill-card" width="140" height="45" rx="8" fill="#15152a" stroke="#25254a" stroke-width="1.5"/>
      <ellipse cx="22" cy="18" rx="8" ry="3" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path d="M 14 18 L 14 24 A 8 3 0 0 0 30 24 L 30 18" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path d="M 14 24 L 14 30 A 8 3 0 0 0 30 30 L 30 24" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="45" y="27" font-size="14" font-weight="700" fill="#e2e8f0">SQL</text>
    </g>

    <g class="anim-float-1" transform="translate(350, 70)">
      <rect class="skill-card" width="140" height="45" rx="8" fill="#15152a" stroke="#25254a" stroke-width="1.5"/>
      <rect x="13" y="24" width="4" height="8" rx="1" fill="#fbbf24"/>
      <rect x="19" y="18" width="4" height="14" rx="1" fill="#f59e0b"/>
      <rect x="25" y="13" width="4" height="19" rx="1" fill="#d97706"/>
      <text x="42" y="27" font-size="14" font-weight="700" fill="#e2e8f0">Power BI</text>
    </g>

    <g class="anim-float-2" transform="translate(30, 130)">
      <rect class="skill-card" width="140" height="45" rx="8" fill="#15152a" stroke="#25254a" stroke-width="1.5"/>
      <circle cx="22" cy="17" r="2.5" fill="#f43f5e"/>
      <circle cx="16" cy="27" r="2.5" fill="#f43f5e"/>
      <circle cx="28" cy="27" r="2.5" fill="#f43f5e"/>
      <line x1="22" y1="17" x2="16" y2="27" stroke="#f43f5e" stroke-width="1.5"/>
      <line x1="22" y1="17" x2="28" y2="27" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="45" y="27" font-size="14" font-weight="700" fill="#e2e8f0">DSA</text>
    </g>

    <g class="anim-float-1" transform="translate(190, 130)">
      <rect class="skill-card" width="140" height="45" rx="8" fill="#15152a" stroke="#25254a" stroke-width="1.5"/>
      <circle cx="16" cy="28" r="2.5" fill="#f97316"/>
      <circle cx="16" cy="16" r="2.5" fill="#f97316"/>
      <circle cx="26" cy="20" r="2.5" fill="#f97316"/>
      <path d="M 16 18.5 L 16 25.5 M 16 22 Q 22 22 24.5 21" fill="none" stroke="#f97316" stroke-width="1.5"/>
      <text x="45" y="27" font-size="14" font-weight="700" fill="#e2e8f0">Git</text>
    </g>

    <g class="anim-float-2" transform="translate(350, 130)">
      <rect class="skill-card" width="140" height="45" rx="8" fill="#15152a" stroke="#25254a" stroke-width="1.5"/>
      <path d="M 22 13 A 8 8 0 0 0 14 21 A 8 8 0 0 0 19.5 28.5 C 19.9 28.6 20 28.4 20 28.2 L 20 26.8 C 17.8 27.3 17.3 25.8 17.3 25.8 C 17 24.9 16.5 24.7 16.5 24.7 C 15.8 24.2 16.5 24.2 16.5 24.2 C 17.3 24.3 17.7 25 17.7 25 C 18.4 26.2 19.5 25.8 20 25.6 C 20 25.1 20.2 24.7 20.5 24.5 C 18.7 24.3 16.8 23.6 16.8 20.5 C 16.8 19.6 17.1 18.9 17.7 18.3 C 17.6 18.1 17.3 17.2 17.7 16.1 C 17.7 16.1 18.4 15.9 20 16.9 A 7.7 7.7 0 0 1 22 16.6 A 7.7 7.7 0 0 1 24 16.9 C 25.6 15.9 26.3 16.1 26.3 16.1 C 26.7 17.2 26.4 18.1 26.3 18.3 C 26.9 18.9 27.2 19.6 27.2 20.5 C 27.2 23.6 25.3 24.3 23.5 24.5 C 23.8 24.8 24 25.3 24 26 L 24 28.2 C 24 28.4 24.1 28.6 24.5 28.5 A 8 8 0 0 0 30 21 A 8 8 0 0 0 22 13 Z" fill="#ecf0f1"/>
      <text x="45" y="27" font-size="14" font-weight="700" fill="#e2e8f0">GitHub</text>
    </g>

    <path d="M 30 210 L 490 210" stroke="#1f1f3a" stroke-width="1.5" />
    <circle cx="180" cy="210" r="4" fill="#00f3ff" filter="url(#glow-cyan-heavy)" />
    <text x="30" y="232" font-size="12" font-weight="600" fill="#a0aec0" letter-spacing="1">Data Analysis • Data Visualization</text>
    <text x="490" y="232" font-size="12" font-weight="800" fill="#9d4edd" text-anchor="end" letter-spacing="1">PASSIONATE LEARNER</text>
  </g>
</svg>
